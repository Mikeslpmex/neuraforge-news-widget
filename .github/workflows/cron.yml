name: Actualizar Noticias Web3
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: npm install && node actualizar.js
      - run: |
          git config user.email "bot@botcaza.ai"
          git config user.name "NeuraForge Bot"
          git add noticias.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update" && git push)
